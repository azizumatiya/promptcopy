/* =========================================================
   STATE
   ========================================================= */

const featuredState = {
    model: "All",
    type: "All",
    category: "All",
    sort: "trending"
};


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function featuredGetSaved() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "promptverse_saved"
            ) || "[]"
        );

    } catch {

        return [];

    }
}


function featuredSetSaved(items) {

    localStorage.setItem(
        "promptverse_saved",
        JSON.stringify(items)
    );

}


function featuredGetLiked() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "promptverse_liked"
            ) || "[]"
        );

    } catch {

        return [];

    }
}


function featuredSetLiked(items) {

    localStorage.setItem(
        "promptverse_liked",
        JSON.stringify(items)
    );

}


/* =========================================================
   HELPERS
   ========================================================= */

function featuredEscapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function featuredFormatNumber(number) {

    if (number >= 1000) {

        return (
            (number / 1000)
                .toFixed(
                    number >= 10000 ? 0 : 1
                )
                .replace(".0", "")
            + "k"
        );

    }

    return number;

}


/* =========================================================
   FILTER
   ========================================================= */

function getFeaturedFilteredPrompts() {

    let result = [
        ...featuredPrompts
    ];


    if (featuredState.model !== "All") {

        result = result.filter(
            prompt =>
                prompt.model ===
                featuredState.model
        );

    }


    if (featuredState.type !== "All") {

        result = result.filter(
            prompt =>
                prompt.type ===
                featuredState.type
        );

    }


    if (featuredState.category !== "All") {

        result = result.filter(
            prompt =>
                prompt.category ===
                featuredState.category
        );

    }


    if (featuredState.sort === "likes") {

        result.sort(
            (a, b) =>
                b.likes - a.likes
        );

    }


    else if (
        featuredState.sort === "newest"
    ) {

        result.sort(
            (a, b) =>
                new Date(b.createdAt) -
                new Date(a.createdAt)
        );

    }


    else {

        result.sort(
            (a, b) =>
                b.likes - a.likes
        );

    }


    return result;

}


/* =========================================================
   RENDER CARD
   ========================================================= */

function renderFeaturedCard(
    prompt,
    index
) {

    const saved =
        featuredGetSaved()
            .includes(prompt.id);

    const liked =
        featuredGetLiked()
            .includes(prompt.id);

    const isVideo =
        prompt.type === "video";


    return `

        <article
            class="featured-card"
            data-id="${prompt.id}"
            tabindex="0"
            role="button"
            aria-label="View ${featuredEscapeHTML(prompt.title)}"
            style="
                animation-delay:
                ${Math.min(index * 35, 400)}ms;
            "
        >

            <div class="featured-card-media">

                <img
                    src="${prompt.image}"
                    alt="${featuredEscapeHTML(prompt.title)}"
                    loading="lazy"
                    onerror="
                        this.onerror=null;
                        this.src=
                        'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1000&q=80';
                    "
                >

                <div
                    class="featured-card-gradient"
                ></div>


                <span
                    class="featured-model-badge"
                >
                    ${featuredEscapeHTML(prompt.model)}
                </span>


                ${
                    isVideo
                    ? `

                        <span
                            class="featured-video-badge"
                            aria-label="Video prompt"
                        >
                            <i
                                data-lucide="play"
                            ></i>
                        </span>

                    `
                    : ""
                }


                <div
                    class="featured-card-actions"
                >

                    <button
                        type="button"
                        class="featured-view-prompt"
                        data-featured-view="${prompt.id}"
                    >
                        View Prompt

                        <i
                            data-lucide="arrow-up-right"
                        ></i>
                    </button>


                    <button
                        type="button"
                        class="
                            featured-save-btn
                            ${saved ? "saved" : ""}
                        "
                        data-featured-save="${prompt.id}"
                        aria-label="Save prompt"
                    >

                        <i
                            data-lucide="bookmark"
                        ></i>

                    </button>

                </div>

            </div>


            <div class="featured-card-content">

                <div
                    class="featured-card-category"
                >
                    ${featuredEscapeHTML(prompt.category)}
                </div>


                <div
                    class="featured-card-title"
                >
                    ${featuredEscapeHTML(prompt.title)}
                </div>


                <div
                    class="featured-card-bottom"
                >

                    <div
                        class="featured-creator"
                    >

                        <img
                            class="featured-avatar"
                            src="${prompt.creatorAvatar}"
                            alt=""
                            loading="lazy"
                        >

                        <span
                            class="featured-creator-name"
                        >
                            ${featuredEscapeHTML(prompt.creator)}
                        </span>

                    </div>


                    <button
                        type="button"
                        class="
                            featured-like-btn
                            ${liked ? "liked" : ""}
                        "
                        data-featured-like="${prompt.id}"
                        aria-label="Like prompt"
                    >

                        <i
                            data-lucide="heart"
                        ></i>

                        <span>
                            ${featuredFormatNumber(prompt.likes)}
                        </span>

                    </button>

                </div>

            </div>

        </article>

    `;

}


/* =========================================================
   RENDER GALLERY
   ========================================================= */

function renderFeaturedGallery() {

    const gallery =
        document.getElementById(
            "featuredGallery"
        );

    const empty =
        document.getElementById(
            "featuredEmptyState"
        );

    const count =
        document.getElementById(
            "featuredResultCount"
        );


    const result =
        getFeaturedFilteredPrompts();


    count.textContent =
        result.length;


    if (!result.length) {

        gallery.innerHTML = "";

        empty.classList.add("show");

        if (window.lucide) {
            lucide.createIcons();
        }

        return;

    }


    empty.classList.remove("show");


    gallery.innerHTML =
        result
            .map(renderFeaturedCard)
            .join("");


    if (window.lucide) {
        lucide.createIcons();
    }

}


/* =========================================================
   MODEL FILTER
   ========================================================= */

document
    .querySelectorAll(
        ".featured-prompts-section .model-filter"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".featured-prompts-section .model-filter"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );


                featuredState.model =
                    button.dataset.model;


                renderFeaturedGallery();

            }
        );

    });


/* =========================================================
   TYPE FILTER
   ========================================================= */

document
    .querySelectorAll(
        ".featured-prompts-section .type-filter"
    )

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".featured-prompts-section .type-filter"

                        btn.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );


                featuredState.type =
                    button.dataset.type;


                renderFeaturedGallery();

            }
        );

    });


/* =========================================================
   CATEGORY FILTER
   ========================================================= */

document
    .querySelectorAll(
        ".featured-prompts-section .category-filter"
    )

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".featured-prompts-section .category-filter"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );


                featuredState.category =
                    button.dataset.category;


                renderFeaturedGallery();

            }
        );

    });


/* =========================================================
   SORT
   ========================================================= */

document
    .getElementById(
        "featuredSortSelect"
    )
    .addEventListener(
        "change",
        function () {

            featuredState.sort =
                this.value;

            renderFeaturedGallery();

        }
    );


/* =========================================================
   CARD CLICK
   ========================================================= */

document.addEventListener(
    "click",
    function (event) {

        const viewButton =
            event.target.closest(
                "[data-featured-view]"
            );


        if (viewButton) {

            event.stopPropagation();

            const id =
                viewButton.dataset.featuredView;

            const prompt =
                featuredPrompts.find(
                    item =>
                        item.id ===
                        Number(id)
                );


            if (!prompt) return;


            /*
             * If your Flask route is:
             *
             * @app.route("/prompt/<pid>")
             *
             * this will open the real prompt page.
             */

            window.location.href =
                "/prompt/" + prompt.id;

            return;

        }


        const saveButton =
            event.target.closest(
                "[data-featured-save]"
            );


        if (saveButton) {

            event.stopPropagation();

            const id =
                Number(
                    saveButton.dataset.featuredSave
                );

            let saved =
                featuredGetSaved();


            if (saved.includes(id)) {

                saved =
                    saved.filter(
                        item => item !== id
                    );

                saveButton.classList.remove(
                    "saved"
                );

            } else {

                saved.push(id);

                saveButton.classList.add(
                    "saved"
                );

            }


            featuredSetSaved(saved);

            return;

        }


        const likeButton =
            event.target.closest(
                "[data-featured-like]"
            );


        if (likeButton) {

            event.stopPropagation();

            const id =
                Number(
                    likeButton.dataset.featuredLike
                );

            let liked =
                featuredGetLiked();


            const prompt =
                featuredPrompts.find(
                    item =>
                        item.id === id
                );


            if (!prompt) return;


            if (liked.includes(id)) {

                liked =
                    liked.filter(
                        item => item !== id
                    );

                prompt.likes =
                    Math.max(
                        0,
                        prompt.likes - 1
                    );

                likeButton.classList.remove(
                    "liked"
                );

            } else {

                liked.push(id);

                prompt.likes += 1;

                likeButton.classList.add(
                    "liked"
                );

                likeButton.classList.remove(
                    "pop"
                );

                void likeButton.offsetWidth;

                likeButton.classList.add(
                    "pop"
                );

            }


            featuredSetLiked(liked);


            const number =
                likeButton.querySelector(
                    "span"
                );

            if (number) {

                number.textContent =
                    featuredFormatNumber(
                        prompt.likes
                    );

            }


            return;

        }


        const card =
            event.target.closest(
                ".featured-card"
            );


        if (card) {

            const id =
                card.dataset.id;

            window.location.href =
                "/prompt/" + id;

        }

    }
);


/* =========================================================
   KEYBOARD ACCESSIBILITY
   ========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key !== "Enter" &&
            event.key !== " "
        ) {
            return;
        }


        const card =
            event.target.closest(
                ".featured-card"
            );


        if (!card) return;


        if (
            event.target.closest("button")
        ) {
            return;
        }


        event.preventDefault();


        window.location.href =
            "/prompt/" +
            card.dataset.id;

    }
);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        renderFeaturedGallery();

        if (window.lucide) {
            lucide.createIcons();
        }

    }
);
