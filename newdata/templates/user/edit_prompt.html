
{% extends "base.html" %}

{% block title %}Edit Prompt — PromptVerse{% endblock %}

{% block content %}


<style>

/* =========================================================
   EDIT PROMPT — SIMPLE ADMIN STYLE
   ========================================================= */

.user-page {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px;
}


/* ================= HEADER ================= */

.user-page-header {
    margin-bottom: 28px;
    padding-bottom: 22px;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.dashboard-eyebrow {
    margin-bottom: 7px;
    color: #8b5cf6;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
}

.user-page-header h1 {
    margin: 0;
    color: #ffffff;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.2;
}

.user-page-header p {
    margin: 7px 0 0;
    color: #858b99;
    font-size: 14px;
}


/* ================= FORM ================= */

.prompt-editor {
    display: flex;
    flex-direction: column;
    gap: 18px;
}


/* ================= SECTION ================= */

.editor-section {
    padding: 24px;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 10px;

    background: rgba(255,255,255,.025);
}


/* ================= FORM GROUP ================= */

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group + .form-group {
    margin-top: 20px;
}

.form-group label {
    color: #dfe1e7;
    font-size: 12px;
    font-weight: 650;
}


/* ================= INPUTS ================= */

.form-group input,
.form-group textarea,
.form-group select {

    width: 100%;

    box-sizing: border-box;

    border: 1px solid rgba(255,255,255,.10);

    border-radius: 7px;

    background: #15171e;

    color: #e9eaf0;

    font-family: inherit;

    font-size: 13px;

    outline: none;

    transition:
        border-color .18s ease,
        background .18s ease;
}

.form-group input,
.form-group select {
    height: 42px;
    padding: 0 12px;
}

.form-group textarea {
    min-height: 100px;
    padding: 12px;
    resize: vertical;
    line-height: 1.6;
}


/* FOCUS */

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {

    border-color: rgba(139,92,246,.65);

    background: #171922;

}


/* PLACEHOLDER */

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #626875;
}


/* SELECT */

.form-group select {
    cursor: pointer;
}


/* ================= FORM GRID ================= */

.form-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 20px;

}

.form-grid .form-group {
    margin: 0;
}


/* ================= IMAGE ================= */

.current-image {

    display: block;

    width: 220px;

    height: 150px;

    margin-top: 18px;

    object-fit: cover;

    border-radius: 8px;

    border: 1px solid rgba(255,255,255,.10);

    background: #11131a;
}


/* ================= ACTIONS ================= */

.editor-actions {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 10px;

    padding-top: 5px;

}


/* ================= BUTTONS ================= */

.primary-btn,
.secondary-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    height: 40px;

    padding: 0 16px;

    border-radius: 7px;

    font-size: 13px;

    font-weight: 600;

    text-decoration: none;

    cursor: pointer;

    transition: .18s ease;

}


/* PRIMARY */

.primary-btn {

    color: #ffffff !important;

    background: #8b5cf6;

    border: 1px solid #8b5cf6;

}

.primary-btn:hover {

    background: #7c4ee8;

    border-color: #7c4ee8;

}


/* SECONDARY */

.secondary-btn {

    color: #b8bdc8 !important;

    background: rgba(255,255,255,.04);

    border: 1px solid rgba(255,255,255,.10);

}

.secondary-btn:hover {

    color: #ffffff !important;

    background: rgba(255,255,255,.08);

}


/* ================= TEXTAREA SIZES ================= */

textarea[name="prompt"] {
    min-height: 260px;
}


/* ================= MOBILE ================= */

@media (max-width: 750px) {

    .user-page {

        padding: 22px 15px;

    }


    .user-page-header h1 {

        font-size: 26px;

    }


    .editor-section {

        padding: 18px;

    }


    .form-grid {

        grid-template-columns: 1fr;

        gap: 18px;

    }


    .current-image {

        width: 100%;

        max-width: 300px;

        height: 190px;

    }


    .editor-actions {

        flex-direction: column-reverse;

        align-items: stretch;

    }


    .primary-btn,
    .secondary-btn {

        width: 100%;

    }

}

</style>


<div class="user-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="user-page-header">

        <div class="dashboard-eyebrow">
            CREATOR STUDIO
        </div>

        <h1>
            Edit Prompt
        </h1>

        <p>
            Update your prompt information.
        </p>

    </div>


    <!-- =====================================================
         FORM
    ====================================================== -->

    <form
        method="POST"
        enctype="multipart/form-data"
        class="prompt-editor"
    >


        <!-- =================================================
             BASIC INFORMATION
        ================================================== -->

        <div class="editor-section">

            <div class="form-group">

                <label>
                    Prompt Title
                </label>

                <input
                    type="text"
                    name="title"
                    value="{{ prompt.title }}"
                    placeholder="Enter prompt title..."
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                    rows="4"
                    placeholder="Describe what this prompt does..."
                >{{ prompt.description or '' }}</textarea>

            </div>


            <div class="form-group">

                <label>
                    Prompt
                </label>

                <textarea
                    name="prompt"
                    rows="12"
                    placeholder="Write your complete AI prompt..."
                    required
                >{{ prompt.prompt }}</textarea>

            </div>

        </div>


        <!-- =================================================
             PROMPT SETTINGS
        ================================================== -->

        <div class="editor-section">

            <div class="form-grid">


                <!-- MODEL -->

                <div class="form-group">

                    <label>
                        Model
                    </label>

                    <select name="model">

                        {% for item in models %}

                        <option
                            value="{{ item }}"
                            {% if prompt.model == item %}
                                selected
                            {% endif %}
                        >
                            {{ item }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- CONTENT TYPE -->

                <div class="form-group">

                    <label>
                        Content Type
                    </label>

                    <select name="prompt_type">

                        {% for item in prompt_types %}

                        <option
                            value="{{ item }}"
                            {% if prompt.prompt_type == item %}
                                selected
                            {% endif %}
                        >

                            {% set ptype = item|lower %}

                            {% if ptype in ['image', 'images'] %}
                                Image

                            {% elif ptype == 'video' %}
                                Video

                            {% elif ptype in ['slides', 'slide'] %}
                                Slides

                            {% elif ptype in ['sheet', 'sheets'] %}
                                Sheet

                            {% elif ptype == 'webpage' %}
                                Webpage

                            {% elif ptype == 'document' %}
                                Document

                            {% else %}
                                {{ item|capitalize }}
                            {% endif %}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- USE CASE -->

                <div class="form-group">

                    <label>
                        Use Case
                    </label>

                    <select name="use_case">

                        {% for item in use_cases %}

                        <option
                            value="{{ item }}"
                            {% if prompt.use_case == item %}
                                selected
                            {% endif %}
                        >
                            {{ item }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- STYLE -->

                <div class="form-group">

                    <label>
                        Style
                    </label>

                    <select name="style">

                        {% for item in styles %}

                        <option
                            value="{{ item }}"
                            {% if prompt.style == item %}
                                selected
                            {% endif %}
                        >
                            {{ item }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- SUBJECT -->

                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <select name="subject">

                        {% for item in subjects %}

                        <option
                            value="{{ item }}"
                            {% if prompt.subject == item %}
                                selected
                            {% endif %}
                        >
                            {{ item }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

        </div>


        <!-- =================================================
             IMAGE
        ================================================== -->

        <div class="editor-section">

            <div class="form-group">

                <label>
                    Image URL
                </label>

                <input
                    type="url"
                    name="image"
                    value="{{ prompt.image or '' }}"
                    placeholder="https://example.com/image.jpg"
                >

            </div>


            {% if prompt.image %}

            <img
                class="current-image"
                src="{{ prompt.image }}"
                alt="{{ prompt.title }}"
            >

            {% endif %}

        </div>


        <!-- =================================================
             ACTIONS
        ================================================== -->

        <div class="editor-actions">

            <a
                href="{{ url_for('user_my_prompts') }}"
                class="secondary-btn"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="primary-btn"
            >
                Save Changes
            </button>

        </div>


    </form>

</div>

{% endblock %}
