```html
{% extends "base.html" %}

{% block title %}Edit Profile — PromptVerse{% endblock %}

{% block content %}



<style>
    /* ================================
       EDIT PROFILE PAGE
       ================================ */

    .user-form-page {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 55px 24px 80px;
        box-sizing: border-box;
    }

    .user-page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 32px;
    }

    .dashboard-eyebrow {
        display: inline-flex;
        align-items: center;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.8px;
        color: #6366f1;
        margin-bottom: 10px;
    }

    .user-page-header h1 {
        margin: 0;
        font-size: 38px;
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -1px;
        color: #111827;
    }

    .user-page-header p {
        margin: 10px 0 0;
        font-size: 15px;
        line-height: 1.6;
        color: #6b7280;
    }

    /* ================================
       FORM CARD
       ================================ */

    .user-form-card {
        width: 100%;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 38px;
        box-sizing: border-box;
        box-shadow:
            0 10px 30px rgba(15, 23, 42, 0.06),
            0 2px 8px rgba(15, 23, 42, 0.03);
    }

    /* ================================
       AVATAR
       ================================ */

    .form-avatar {
        width: 82px;
        height: 82px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;

        background: linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

        color: #ffffff;
        font-size: 30px;
        font-weight: 800;

        box-shadow:
            0 8px 22px rgba(99, 102, 241, 0.25);
    }

    /* ================================
       FORM GROUP
       ================================ */

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: block;
        margin-bottom: 9px;

        font-size: 14px;
        font-weight: 700;
        color: #111827;
    }

    .form-group input {
        width: 100%;
        height: 50px;
        padding: 0 15px;

        box-sizing: border-box;

        border: 1px solid #d1d5db;
        border-radius: 11px;

        background: #ffffff;
        color: #111827;

        font-size: 15px;
        font-family: inherit;

        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;
    }

    .form-group input::placeholder {
        color: #9ca3af;
    }

    .form-group input:focus {
        border-color: #6366f1;

        box-shadow:
            0 0 0 4px rgba(99, 102, 241, 0.10);
    }

    .form-group input:disabled {
        background: #f3f4f6;
        color: #6b7280;
        cursor: not-allowed;
        border-color: #e5e7eb;
    }

    .form-group small {
        display: block;
        margin-top: 8px;

        font-size: 12px;
        line-height: 1.5;
        color: #9ca3af;
    }

    /* ================================
       ACTION BUTTONS
       ================================ */

    .form-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;

        margin-top: 34px;
        padding-top: 25px;

        border-top: 1px solid #f0f0f0;
    }

    .secondary-btn,
    .primary-btn {
        min-height: 46px;
        padding: 0 20px;

        border-radius: 10px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        font-family: inherit;
        font-size: 14px;
        font-weight: 700;

        text-decoration: none;
        cursor: pointer;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease,
            border-color 0.2s ease;
    }

    .secondary-btn {
        background: #ffffff;
        color: #374151;
        border: 1px solid #d1d5db;
    }

    .secondary-btn:hover {
        background: #f9fafb;
        border-color: #9ca3af;
        transform: translateY(-1px);
    }

    .primary-btn {
        border: 1px solid #6366f1;
        background: #6366f1;
        color: #ffffff;

        box-shadow:
            0 6px 16px rgba(99, 102, 241, 0.20);
    }

    .primary-btn:hover {
        background: #4f46e5;
        border-color: #4f46e5;

        transform: translateY(-1px);

        box-shadow:
            0 9px 20px rgba(99, 102, 241, 0.28);
    }

    .primary-btn:active,
    .secondary-btn:active {
        transform: translateY(0);
    }

    /* ================================
       RESPONSIVE
       ================================ */

    @media (max-width: 700px) {

        .user-form-page {
            padding: 35px 16px 60px;
        }

        .user-page-header {
            margin-bottom: 24px;
        }

        .user-page-header h1 {
            font-size: 30px;
        }

        .user-page-header p {
            font-size: 14px;
        }

        .user-form-card {
            padding: 25px 20px;
            border-radius: 16px;
        }

        .form-avatar {
            width: 70px;
            height: 70px;
            font-size: 26px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 21px;
        }

        .form-actions {
            flex-direction: column-reverse;
            align-items: stretch;
        }

        .secondary-btn,
        .primary-btn {
            width: 100%;
        }
    }

    @media (max-width: 420px) {

        .user-form-page {
            padding-left: 12px;
            padding-right: 12px;
        }

        .user-page-header h1 {
            font-size: 27px;
        }

        .user-form-card {
            padding: 22px 16px;
        }

        .form-group input {
            height: 48px;
            font-size: 14px;
        }
    }
</style>


<div class="user-form-page">

    <div class="user-page-header">

        <div>

            <div class="dashboard-eyebrow">
                ACCOUNT
            </div>

            <h1>
                Edit Profile
            </h1>

            <p>
                Update your account information.
            </p>

        </div>

    </div>


    <form
        method="post"
        class="user-form-card"
    >

        <div class="form-avatar">
            {{ current_user.get('name', 'U')[0]|upper }}
        </div>


        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                id="name"
                type="text"
                name="name"
                value="{{ current_user.get('name', '') }}"
                placeholder="Your name"
                autocomplete="name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                value="{{ current_user.get('email', '') }}"
                autocomplete="email"
                disabled
            >

            <small>
                Email address cannot be changed here.
            </small>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('user_profile') }}"
                class="secondary-btn"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="primary-btn"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
```
